<div class="art-background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<main class="app-container">
    <button class="stats-button" [class.visible]="echoMessage !== ''" (click)="goToStats()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
    </button>

    <div class="button-wrapper">
        <button class="mystic-button" [class.pressed]="isPressed" (click)="pressButton()">
            <span>{{ buttonText }}</span>
        </button>
    </div>

    <p class="echo-text" [class.visible]="echoMessage !== ''">
        {{ echoMessage }}
    </p>
</main>
