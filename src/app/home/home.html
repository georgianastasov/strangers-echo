<div class="art-background">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<main class="app-container" *ngIf="!isAbyssMode()">
    <img src="favicon.png" class="site-logo" alt="Logo">

    <button class="stats-button" [class.visible]="echoMessage() !== '' || milestoneMessage() !== ''"
        (click)="goToStats()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
    </button>

    <div class="button-wrapper">
        <button class="mystic-button" [class.pressed]="isPressed()" [class.pulsing]="isPulsing()"
            (click)="pressButton()" (mousedown)="onButtonDown($event)" (mouseup)="onButtonUp()"
            (mouseleave)="onButtonUp()" (touchstart)="onButtonDown($event)" (touchend)="onButtonUp()">
            <span>{{ buttonText() }}</span>
        </button>
    </div>

    <div class="echo-glass-panel" [class.visible]="echoMessage() !== '' || milestoneMessage() !== ''">
        {{ milestoneMessage() !== '' ? milestoneMessage() : echoMessage() }}
    </div>

    <footer class="legal-disclaimer">
        Anonymous experiment. Touching shares your approximate city. <br />
        100% Anonymous. No personal data or IP addresses are stored.
    </footer>
</main>

<div class="abyss-overlay" *ngIf="isAbyssMode()">
    <div class="abyss-content glass-panel">
        <h2 class="glitch-text" data-text="SYSTEM COMPROMISED">SYSTEM COMPROMISED</h2>
        <p class="abyss-hint">The key lies in the echo of the stranger.</p>

        <div class="cipher-matrix">
            <div class="matrix-row"><span>Y</span><span>X</span><span>Z</span><span>Y</span><span>Y</span><span>F</span>
            </div>
            <div class="matrix-row"><span>.</span><span>U</span><span>G</span><span>Z</span><span>/</span><span>Z</span>
            </div>
            <div class="matrix-row"><span>X</span><span>I</span><span>Y</span><span>Y</span><span>A</span><span>S</span>
            </div>
            <div class="matrix-row">
                <span>V</span><span>O</span><span>G</span><span>W</span><span>J</span><span>F</span><span>H</span><span>E</span>
            </div>
        </div>

        <input type="text" class="abyss-input" placeholder="ENTER DECRYPT ANSWER" (input)="checkCipher($event)">

        <button class="abyss-escape-btn" (click)="escapeAbyss()">[ INITIATE REBOOT ]</button>
    </div>
</div>
